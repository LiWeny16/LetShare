# LetShare 前端静态站（阿里云 CDN 回源口）
# 部署位置: ECS /etc/nginx/sites-available/letshare-static（软链到 sites-enabled）
# 用途:     CDN 回源 -> 本机 :80（server_name letshare.fun，需与 CDN 回源 HOST 一致）
#           另保留 :18081 作为备用回源口/健康检查口
# 注意:     :443 由 letshare-server(Go) 占用；Go 的 HTTP→HTTPS 跳转在 :8080
#           reload 前先 nginx -t
server {
    listen 80;
    listen [::]:80;
    server_name letshare.fun;
    root /var/www/letshare;
    index index.html;
    sendfile on;
    tcp_nopush on;
    access_log /var/log/nginx/letshare-static.log;

    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /sw.js         { add_header Cache-Control "no-store"; }
    location = /version.json  { add_header Cache-Control "no-cache"; }
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
    location / {
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "no-cache";
    }
}

# 兼容旧行为: 其余 Host 走 :80 的一律 301 到 https（如 ecs.letshare.fun）
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# 备用回源口（保留，安全组可按需关闭）
server {
    listen 18081;
    listen [::]:18081;
    server_name letshare.fun;
    root /var/www/letshare;
    index index.html;
    sendfile on;
    tcp_nopush on;

    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /sw.js         { add_header Cache-Control "no-store"; }
    location = /version.json  { add_header Cache-Control "no-cache"; }
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
    location / {
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "no-cache";
    }
}
