# LetShare 前端静态站（阿里云 CDN 回源口）
# 部署位置: ECS /etc/nginx/sites-available/letshare-static（软链到 sites-enabled）
# 用途:     CDN 回源 -> 本机 18081；server_name 必须与 CDN 回源 HOST (letshare.fun) 匹配
# 注意:     不要绑 80/443 —— 由 letshare-server(Go) 占用；reload 前先 nginx -t
server {
    listen 18081;
    listen [::]:18081;
    server_name letshare.fun;
    root /var/www/letshare;
    index index.html;
    sendfile on;
    tcp_nopush on;
    access_log /var/log/nginx/letshare-static.log;

    location = /index.html    { add_header Cache-Control "no-cache"; }
    location = /sw.js         { add_header Cache-Control "no-store"; }
    location = /version.json  { add_header Cache-Control "no-cache"; }
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
    location / {
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "no-cache";
    }
}
