name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (TS + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 必须与本机/lockfile 生成版本一致：pnpm 9 不认 pnpm-workspace.yaml 的 overrides
          # （报 ERR_PNPM_LOCKFILE_CONFIG_MISMATCH），lockfile 由 pnpm 11 生成
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test:unit

      # E2E（tests/e2e/，需真浏览器 + 起本地服务器/连生产）不在 CI 跑，
      # 本地运行：node scripts/run-tests.cjs 或 pnpm test:e2e:call

      - name: Production build
        run: pnpm build

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Go vet
        run: go vet ./cmd/... ./internal/...

      - name: Go test
        run: go test ./internal/... -count=1 -race

      - name: Go build
        run: go build ./cmd/server/
